<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>PV Fire - Projeto de Vida 3D</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input {
      -webkit-user-select: text;
      user-select: text;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #7dd3fc;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .dpad-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(245, 158, 11, 0.7);
      backdrop-filter: blur(8px);
      color: #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.1s ease;
      cursor: pointer;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.active {
      background: #f59e0b;
      color: #0f172a;
      transform: scale(0.92);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
    }
    .jump-btn {
      background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
      border: 1.5px solid #fef08a;
      color: #0f172a;
      border-radius: 50%;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }
    .jump-btn:active {
      transform: scale(0.9);
      box-shadow: 0 0 18px rgba(254, 240, 138, 0.9);
    }
  </style>
</head>
<body class="text-white">

  <!-- Tela Inicial -->
  <div id="modal-start" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 text-center space-y-5 shadow-2xl">
      <div class="w-16 h-16 mx-auto rounded-full bg-amber-400/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-3xl">
        <i class="fa-solid fa-fire"></i>
      </div>
      <h2 class="text-xl sm:text-2xl font-extrabold text-amber-300 leading-snug">
        Coloque seu nome abaixo para jogar o PV Fire!
      </h2>
      <div>
        <input
          id="player-name-input"
          type="text"
          placeholder="Digite seu nome aqui..."
          class="w-full px-4 py-3 rounded-xl bg-slate-800 border-2 border-slate-600 focus:border-amber-400 focus:outline-none text-white text-center font-semibold text-base"
        />
      </div>
      <button id="btn-start-game" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold py-3 rounded-xl text-base shadow-lg transition">
        Começar
      </button>
    </div>
  </div>

  <!-- Canvas principal 3D -->
  <div id="canvas-container"></div>

  <!-- Interface HUD do Jogo -->
  <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4">

    <!-- Topo: Status da Fase centralizado -->
    <div class="flex items-start justify-center w-full">
      <div id="phase-badge" class="bg-slate-900/85 border border-amber-400/60 text-amber-300 px-4 py-2 rounded-xl text-sm sm:text-base font-bold shadow-lg text-center">
        Colete a dica 1. Cuidado com os inimigos!
      </div>
    </div>

    <!-- Rodapé e Controle Virtual (apenas direção e botão Jogue no meio na Fase 2) -->
    <div class="max-w-sm mx-auto w-full pointer-events-auto">
      
      <!-- Controle Físico Compacto -->
      <div id="dpad-container" class="grid grid-cols-3 gap-1.5 w-36 h-14 mx-auto p-1.5 bg-slate-900/90 backdrop-blur-md rounded-2xl border border-slate-700/80 shadow-2xl">
        <button id="btn-left" class="dpad-btn text-xs" title="Girar Esquerda (A / Seta Esq)">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <div id="center-slot" class="flex items-center justify-center">
          <button id="btn-throw" class="hidden dpad-btn jump-btn w-full h-full text-[9px] flex-col gap-0" title="Lançar Esfera (Espaço)">
            <i class="fa-solid fa-bolt text-xs"></i>
            <span>Jogue</span>
          </button>
        </div>
        <button id="btn-right" class="dpad-btn text-xs" title="Girar Direita (D / Seta Dir)">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Banner rápido de feedback / transição -->
  <div id="toast-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-30 bg-slate-900/95 border-2 border-amber-400 text-amber-200 px-4 py-2 rounded-xl shadow-2xl text-xs sm:text-sm font-bold text-center max-w-md pointer-events-none"></div>

  <!-- Modal de Transição para a Fase 2 -->
  <div id="modal-phase2-intro" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 text-center space-y-5 shadow-2xl">
      <div class="w-16 h-16 mx-auto rounded-full bg-amber-400/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-3xl">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-amber-300 leading-snug">
        O jogo virou! Persiga os inimigos!
      </h2>
      <button id="btn-proceed-phase2" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold py-3 rounded-xl text-base shadow-lg transition">
        Prosseguir
      </button>
    </div>
  </div>

  <!-- Modal 2: Leitura e Pergunta (Fase 1 e Fase 2) -->
  <div id="modal-question" class="hidden fixed inset-0 z-40 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div id="modal-q-header" class="px-5 py-3.5 bg-slate-800 border-b border-slate-700 flex items-center justify-between gap-2">
        <span id="modal-q-badge" class="text-xs font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950">
          Leitura do Projeto de Vida
        </span>
        <span id="modal-q-subtitle" class="text-xs text-slate-300 font-semibold truncate">Construindo o Futuro</span>
        <span id="modal-q-timer" class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-950 border border-amber-400/70 text-amber-300 whitespace-nowrap">
          <i class="fa-regular fa-clock mr-1"></i>50s
        </span>
      </div>

      <div class="p-5 overflow-y-auto space-y-4">
        <!-- Dica correspondente (exibida no mesmo bloco de rolagem da questão na Fase 2) -->
        <div id="modal-q-tips-box" class="hidden bg-slate-950/80 border border-amber-400/50 rounded-xl p-3.5">
          <div id="modal-q-tips-list" class="text-xs sm:text-sm text-slate-200 leading-relaxed"></div>
        </div>

        <!-- Texto base / enunciado -->
        <div id="modal-q-text" class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 text-sm sm:text-base leading-relaxed text-slate-100"></div>

        <!-- Pergunta -->
        <p id="modal-q-prompt" class="font-bold text-amber-300 text-sm sm:text-base"></p>

        <!-- Alternativas -->
        <div id="modal-q-options" class="space-y-2.5"></div>

        <!-- Feedback -->
        <div id="modal-q-feedback" class="hidden rounded-xl p-3.5 text-sm font-semibold"></div>
      </div>

      <div class="px-5 py-3 bg-slate-800 border-t border-slate-700 flex justify-end">
        <button id="btn-continue-game" class="hidden bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold px-5 py-2 rounded-xl text-sm shadow-lg transition">
          CONTINUAR JOGO
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Vitória Final -->
  <div id="modal-victory" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
      <div class="w-16 h-16 mx-auto rounded-full bg-amber-400/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-3xl">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 id="victory-message" class="text-xl sm:text-2xl font-extrabold text-amber-300 leading-snug">
        Parabéns, Jogador! Mostre esta tela para o professor e receba o seu ponto!
      </h2>
      <button onclick="location.reload()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold py-3 rounded-xl text-sm shadow-lg transition">
        JOGAR NOVAMENTE
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURAÇÕES INICIAIS (CENÁRIO DIURNO)
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Céu de dia vibrante e neblina atmosférica clara
    const skyColor = new THREE.Color(0x87ceeb);
    scene.background = skyColor;
    scene.fog = new THREE.Fog(0xbae6fd, 85, 320);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 450);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", stencil: false, depth: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.0));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap;
    renderer.shadowMap.autoUpdate = false;
    container.appendChild(renderer.domElement);

    // ==========================================
    // 2. ILUMINAÇÃO SOLAR (DIA)
    // ==========================================
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x64748b, 0.8);
    hemiLight.position.set(0, 100, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
    sunLight.position.set(80, 140, 65);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 512;
    sunLight.shadow.mapSize.height = 512;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 360;
    const d = 145;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // ==========================================
    // 3. ESTRUTURAS DE COLISÃO E TRANSPARÊNCIA
    // ==========================================
    const colliders = [];          // Objetos sólidos com física (caixas AABB)
    const occludableMeshes = [];   // Malhas que podem ficar transparentes

    // Cenário 2x maior
    const CITY_LIMIT = 136;

    // Cache de texturas de fachada para evitar recriar canvas idênticos na GPU
    const wallTextureCache = new Map();
    const sharedRoofMat = new THREE.MeshStandardMaterial({
      color: 0x64748b,
      roughness: 0.8,
      transparent: true,
      opacity: 1.0
    });

    function getCachedWallTexture(hexStr, wallW, wallH, hasDoor) {
      const key = `${hexStr}_${wallW}_${wallH}_${hasDoor}`;
      if (wallTextureCache.has(key)) return wallTextureCache.get(key);

      const canvas = document.createElement('canvas');
      const pxPerUnit = 12; // Resolução otimizada para memória de vídeo e fluidez
      canvas.width = Math.max(64, Math.round(wallW * pxPerUnit));
      canvas.height = Math.max(64, Math.round(wallH * pxPerUnit));
      const ctx = canvas.getContext('2d');

      // Cor base da parede
      ctx.fillStyle = hexStr;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Friso / Rodapé arquitetônico
      ctx.fillStyle = 'rgba(15, 23, 42, 0.14)';
      ctx.fillRect(0, canvas.height - 14, canvas.width, 14);
      ctx.fillRect(0, 0, canvas.width, 8);

      // Janelas
      const cols = Math.max(2, Math.floor(wallW / 2.4));
      const isLowHouse = wallH <= 4.0;
      const rows = isLowHouse ? 1 : Math.max(2, Math.floor((wallH - 3.5) / 3.0));
      const padX = canvas.width / cols;
      const topAreaH = isLowHouse ? canvas.height * 0.65 : canvas.height - 3.6 * pxPerUnit;
      const padY = topAreaH / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (isLowHouse && hasDoor && c === Math.floor(cols / 2)) continue;

          const wx = c * padX + padX * 0.24;
          const wy = (isLowHouse ? canvas.height * 0.28 : 12) + r * padY + padY * 0.16;
          const ww = padX * 0.52;
          const wh = Math.min(padY * 0.62, canvas.height * 0.38);

          ctx.fillStyle = '#334155';
          ctx.fillRect(wx - 1.5, wy - 1.5, ww + 3, wh + 3);

          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(wx, wy, ww, wh);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.fillRect(wx + 1.5, wy + 1.5, ww * 0.35, wh - 3);
        }
      }

      // Porta no térreo
      if (hasDoor) {
        const doorW = Math.min(canvas.width * 0.24, 1.6 * pxPerUnit);
        const doorH = Math.min(canvas.height * 0.68, 2.5 * pxPerUnit);
        const doorX = (canvas.width - doorW) / 2;
        const doorY = canvas.height - doorH;

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(doorX - 3, doorY - 3, doorW + 6, doorH + 3);

        ctx.fillStyle = '#78350f';
        ctx.fillRect(doorX, doorY, doorW, doorH);

        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(doorX + doorW * 0.18, doorY + doorH * 0.12, doorW * 0.64, doorH * 0.42);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(doorX + doorW * 0.78, doorY + doorH * 0.58, 3, 7);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      wallTextureCache.set(key, tex);
      return tex;
    }

    // Gera materiais de fachada individuais por prédio (para transparência individual sem duplicar texturas)
    function createBuildingMaterials(baseColorHex, width, height, depth) {
      const hexStr = '#' + new THREE.Color(baseColorHex).getHexString();

      const sideTex = getCachedWallTexture(hexStr, depth, height, false);
      const frontTex = getCachedWallTexture(hexStr, width, height, true);

      const sideMat = new THREE.MeshStandardMaterial({
        map: sideTex,
        roughness: 0.65,
        metalness: 0.1,
        transparent: true,
        opacity: 1.0
      });
      const frontMat = new THREE.MeshStandardMaterial({
        map: frontTex,
        roughness: 0.65,
        metalness: 0.1,
        transparent: true,
        opacity: 1.0
      });

      return [sideMat, sideMat, sharedRoofMat, sharedRoofMat, frontMat, frontMat];
    }

    // Função auxiliar para criar qualquer bloco sólido da cidade
    function createSolidBox(x, y, z, w, h, d, colorHex, options = {}) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = options.isBuilding
        ? createBuildingMaterials(colorHex, w, h, d)
        : new THREE.MeshStandardMaterial({
            color: colorHex,
            roughness: options.roughness ?? 0.7,
            metalness: options.metalness ?? 0.1,
            transparent: options.occludable !== false,
            opacity: 1.0
          });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = options.castShadow !== false;
      mesh.receiveShadow = options.receiveShadow !== false;
      mesh.matrixAutoUpdate = false;
      mesh.updateMatrix();
      scene.add(mesh);

      if (options.occludable !== false) {
        occludableMeshes.push(mesh);
      }

      const collider = {
        mesh: mesh,
        minX: x - w / 2,
        maxX: x + w / 2,
        minY: y,
        maxY: y + h,
        minZ: z - d / 2,
        maxZ: z + d / 2
      };

      colliders.push(collider);
      return collider;
    }

    // ==========================================
    // 4. CONSTRUÇÃO DA CIDADE E HORIZONTE
    // ==========================================
    
    // Chão principal (300x300)
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    ground.matrixAutoUpdate = false;
    ground.updateMatrix();
    scene.add(ground);

    const roadPositions = [-90, -45, 0, 45, 90];

    // Malha de Ruas sem linhas amarelas
    function createCityRoads() {
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });

      const geoNS = new THREE.PlaneGeometry(11, 272);
      const geoLO = new THREE.PlaneGeometry(272, 11);

      roadPositions.forEach(pos => {
        const rNS = new THREE.Mesh(geoNS, roadMat);
        rNS.rotation.x = -Math.PI / 2;
        rNS.position.set(pos, 0.01, 0);
        rNS.receiveShadow = true;
        rNS.matrixAutoUpdate = false;
        rNS.updateMatrix();
        scene.add(rNS);

        const rLO = new THREE.Mesh(geoLO, roadMat);
        rLO.rotation.x = -Math.PI / 2;
        rLO.position.set(0, 0.012, pos);
        rLO.receiveShadow = true;
        rLO.matrixAutoUpdate = false;
        rLO.updateMatrix();
        scene.add(rLO);
      });
    }
    createCityRoads();

    // Muros de Limite da Cidade
    function createCityBoundaries() {
      const wallHeight = 5.0;
      const wallThickness = 2.5;
      const span = CITY_LIMIT * 2 + wallThickness;
      const wallColor = 0x94a3b8;

      createSolidBox(0, 0, -CITY_LIMIT - 1.25, span, wallHeight, wallThickness, wallColor, { occludable: false, castShadow: false });
      createSolidBox(0, 0, CITY_LIMIT + 1.25, span, wallHeight, wallThickness, wallColor, { occludable: false, castShadow: false });
      createSolidBox(-CITY_LIMIT - 1.25, 0, 0, wallThickness, wallHeight, span, wallColor, { occludable: false, castShadow: false });
      createSolidBox(CITY_LIMIT + 1.25, 0, 0, wallThickness, wallHeight, span, wallColor, { occludable: false, castShadow: false });
    }
    createCityBoundaries();

    // Horizonte da Cidade mesclado em 1 única malha
    function createCityHorizon() {
      const palette = [
        new THREE.Color(0x94a3b8),
        new THREE.Color(0x64748b),
        new THREE.Color(0xcbd5e1),
        new THREE.Color(0x7dd3fc),
        new THREE.Color(0xe2e8f0)
      ];
      const farColor = new THREE.Color(0xb0c4de);

      const positions = [];
      const normals = [];
      const colors = [];
      const indices = [];
      let vertexOffset = 0;

      function appendBox(bx, by, bz, bw, bh, bd, colorObj) {
        const boxGeo = new THREE.BoxGeometry(bw, bh, bd);
        boxGeo.translate(bx, by, bz);
        const nonIndexed = boxGeo.index ? boxGeo.toNonIndexed() : boxGeo;
        const posAttr = nonIndexed.attributes.position;
        const normAttr = nonIndexed.attributes.normal;

        for (let i = 0; i < posAttr.count; i++) {
          positions.push(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
          normals.push(normAttr.getX(i), normAttr.getY(i), normAttr.getZ(i));
          colors.push(colorObj.r, colorObj.g, colorObj.b);
          indices.push(vertexOffset++);
        }
        boxGeo.dispose();
        if (nonIndexed !== boxGeo) nonIndexed.dispose();
      }

      for (let angle = 0; angle < Math.PI * 2; angle += 0.08) {
        const dist = 165 + (Math.sin(angle * 7) * 20 + 20);
        const bx = Math.cos(angle) * dist;
        const bz = Math.sin(angle) * dist;
        const bw = 12 + Math.abs(Math.cos(angle * 5)) * 14;
        const bd = 12 + Math.abs(Math.sin(angle * 3)) * 14;
        const bh = 30 + Math.abs(Math.sin(angle * 11)) * 60;
        const col = palette[Math.floor(Math.abs(Math.sin(angle * 13)) * palette.length)];
        appendBox(bx, bh / 2 - 1, bz, bw, bh, bd, col);
      }

      for (let angle = 0.04; angle < Math.PI * 2; angle += 0.11) {
        const dist = 225 + (Math.cos(angle * 5) * 25 + 25);
        const bx = Math.cos(angle) * dist;
        const bz = Math.sin(angle) * dist;
        const bh = 60 + Math.abs(Math.cos(angle * 9)) * 75;
        appendBox(bx, bh / 2 - 1, bz, 22, bh, 22, farColor);
      }

      const mergedGeo = new THREE.BufferGeometry();
      mergedGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      mergedGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      mergedGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      mergedGeo.setIndex(indices);

      const mergedMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.7
      });

      const horizonMesh = new THREE.Mesh(mergedGeo, mergedMat);
      horizonMesh.matrixAutoUpdate = false;
      horizonMesh.updateMatrix();
      scene.add(horizonMesh);
    }
    createCityHorizon();

    // ==========================================
    // 5. PRÉDIOS DA CIDADE
    // ==========================================
    function populateCity() {
      const buildingCoords = [
        // Anel Interno
        { x: -24, z: -24, w: 12, h: 18, d: 12, c: 0xe2e8f0 },
        { x: 24,  z: -24, w: 12, h: 22, d: 12, c: 0xcbd5e1 },
        { x: -24, z: 24,  w: 12, h: 16, d: 12, c: 0xf1f5f9 },
        { x: 24,  z: 24,  w: 12, h: 20, d: 12, c: 0x94a3b8 },

        // Anel Médio
        { x: -68, z: -24, w: 14, h: 24, d: 12, c: 0xe2e8f0 },
        { x: 68,  z: -24, w: 14, h: 20, d: 12, c: 0xcbd5e1 },

    function createPVMaterials(hexColor, baseMat) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = hexColor;
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 70px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PV', 64, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const frontBackMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
      return [baseMat, baseMat, baseMat, baseMat, frontBackMat, frontBackMat];
    }

    function buildCharacterRig(torsoMaterials) {
      const group = new THREE.Group();
      const torsoHeight = 1.1;
      const torso = new THREE.Mesh(sharedTorsoGeo, torsoMaterials);
      torso.position.y = 1.35;
      group.add(torso);

      const headRadius = 0.28;
      const head = new THREE.Mesh(sharedHeadGeo, whiteMat);
      head.position.y = torsoHeight / 2 + headRadius + 0.05;
      torso.add(head);

      const eyeLeft = new THREE.Mesh(sharedEyeGeo, sharedEyeMat);
      eyeLeft.position.set(-0.1, 0.05, 0.24);
      head.add(eyeLeft);

      const eyeRight = new THREE.Mesh(sharedEyeGeo, sharedEyeMat);
      eyeRight.position.set(0.1, 0.05, 0.24);
      head.add(eyeRight);

      const smile = new THREE.Mesh(sharedSmileGeo, sharedEyeMat);
      smile.position.set(0, -0.06, 0.24);
      smile.rotation.x = Math.PI;
      head.add(smile);

      const armLeftGroup = new THREE.Group();
      armLeftGroup.position.set(0.48, torsoHeight / 2 + 0.1, 0);
      const armLeft = new THREE.Mesh(sharedArmGeo, whiteMat);
      armLeftGroup.add(armLeft);
      torso.add(armLeftGroup);

      const armRightGroup = new THREE.Group();
      armRightGroup.position.set(-0.48, torsoHeight / 2 + 0.1, 0);
      const armRight = new THREE.Mesh(sharedArmGeo, whiteMat);
      armRightGroup.add(armRight);
      torso.add(armRightGroup);

      const legLeftGroup = new THREE.Group();
      legLeftGroup.position.set(0.18, -torsoHeight / 2, 0);
      const legLeft = new THREE.Mesh(sharedLegGeo, blackMat);
      legLeftGroup.add(legLeft);
      torso.add(legLeftGroup);

      const legRightGroup = new THREE.Group();
      legRightGroup.position.set(-0.18, -torsoHeight / 2, 0);
      const legRight = new THREE.Mesh(sharedLegGeo, blackMat);
      legRightGroup.add(legRight);
      torso.add(legRightGroup);

      return { group, torso, head, armLeftGroup, armRightGroup, legLeftGroup, legRightGroup };
    }

    function resolveHorizontalCollisions(nextX, nextZ, currentY) {
      const maxBound = CITY_LIMIT - playerRadius;
      nextX = Math.max(-maxBound, Math.min(maxBound, nextX));
      nextZ = Math.max(-maxBound, Math.min(maxBound, nextZ));

      const pBottom = currentY + 0.08;
      const pTop = currentY + playerHeight;

      for (let i = 0; i < colliders.length; i++) {
        const box = colliders[i];

        if (pTop > box.minY && pBottom < box.maxY) {
          const closestX = Math.max(box.minX, Math.min(nextX, box.maxX));
          const closestZ = Math.max(box.minZ, Math.min(nextZ, box.maxZ));

          const distX = nextX - closestX;
          const distZ = nextZ - closestZ;
          const distSq = distX * distX + distZ * distZ;

          if (distSq < playerRadius * playerRadius) {
            const dist = Math.sqrt(distSq);
            if (dist > 0.0001) {
              const overlap = playerRadius - dist;
              nextX += (distX / dist) * overlap;
              nextZ += (distZ / dist) * overlap;
            } else {
              const penLeft = Math.abs(nextX - box.minX);
              const penRight = Math.abs(box.maxX - nextX);
              const penFront = Math.abs(nextZ - box.minZ);
              const penBack = Math.abs(box.maxZ - nextZ);
              const minPen = Math.min(penLeft, penRight, penFront, penBack);

              if (minPen === penLeft) nextX = box.minX - playerRadius;
              else if (minPen === penRight) nextX = box.maxX + playerRadius;
              else if (minPen === penFront) nextZ = box.minZ - playerRadius;
              else nextZ = box.maxZ + playerRadius;
            }
          }
        }
      }

      return { x: nextX, z: nextZ };
    }

    function getSupportFloorHeight(x, z, currentY) {
      let highestFloor = 0;

      for (let i = 0; i < colliders.length; i++) {
        const box = colliders[i];
        const withinX = (x + playerRadius * 0.75) > box.minX && (x - playerRadius * 0.75) < box.maxX;
        const withinZ = (z + playerRadius * 0.75) > box.minZ && (z - playerRadius * 0.75) < box.maxZ;

        if (withinX && withinZ) {
          if (currentY >= box.maxY - 0.35 && box.maxY > highestFloor) {
            highestFloor = box.maxY;
          }
        }
      }

            modalQFeedback.textContent = "Resposta correta! Você coletou a dica e ela ficará disponível para consulta na segunda parte do jogo.";

            btn.classList.add('bg-red-900/80', 'border-red-400', 'text-red-100');
            applyItemWrongOutcome("Ops! Resposta incorreta.");

        });

        modalQOptions.appendChild(btn);
      });

      btnContinueGame.onclick = () => {
        clearQuestionTimer();
        modalQuestion.classList.add('hidden');
        isPaused = false;
        clock.getDelta();

        if (collectedCount === CARTESIAN_ITEMS.length && gamePhase === 1) {
          openPhaseTwoIntroModal();
        }
      };

      modalQuestion.classList.remove('hidden');
    }

    function openEnemyExamModal(enemyEntity) {
      isPaused = true;
      resetMovementKeys();

      if (availableExamQuestions.length === 0) {
        availableExamQuestions = [...EXAM_QUESTIONS];
      }
      const qIndex = Math.floor(Math.random() * availableExamQuestions.length);
      const examTopic = availableExamQuestions[qIndex];
      const examQ = examTopic.versions[examTopic.attemptIndex % examTopic.versions.length];

      modalQHeader.classList.remove('hidden');
      modalQBadge.textContent = "Questão de Projeto de Vida";
      modalQBadge.className = "text-xs font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950";
      modalQSubtitle.textContent = "Consulte a dica abaixo";

      renderMatchingTipsInQuestionModal(examTopic.relatedTipIds);
      modalQTipsBox.classList.remove('hidden');

      modalQText.textContent = examQ.statement;
      modalQPrompt.textContent = examQ.question;
      modalQFeedback.classList.add('hidden');
      btnContinueGame.classList.add('hidden');
      modalQOptions.innerHTML = '';

      let answered = false;
      let answeredCorrectly = false;

      function applyExamWrongOutcome(customMessage) {
        if (answered) return;
        answered = true;
        clearQuestionTimer();

        examTopic.attemptIndex = (examTopic.attemptIndex + 1) % examTopic.versions.length;

        modalQFeedback.className = "rounded-xl p-3.5 text-sm font-semibold bg-red-950/90 border border-red-400 text-red-200";
        modalQFeedback.textContent = customMessage;
        modalQFeedback.classList.remove('hidden');
        btnContinueGame.classList.remove('hidden');
      }

      startQuestionTimer(90, (reason) => {
        applyExamWrongOutcome(`${reason} A questão foi anulada e o oponente escapou. Leia a dica com atenção, persiga-o e tente novamente!`);
      });

      examQ.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-sm text-slate-100 transition font-medium";
        btn.textContent = `${String.fromCharCode(65 + idx)}) ${optText}`;

        btn.addEventListener('click', () => {
          if (answered) return;

          const isCorrect = idx === examQ.correctIndex;
          if (isCorrect) {
            answered = true;
            answeredCorrectly = true;
            clearQuestionTimer();
            btn.classList.remove('bg-slate-800', 'border-slate-600');
            btn.classList.add('bg-emerald-900/80', 'border-emerald-400', 'text-emerald-100');

            availableExamQuestions.splice(qIndex, 1);
            defeatedEnemiesCount++;
            updatePhaseTwoBadge();

            modalQFeedback.className = "rounded-xl p-3.5 text-sm font-semibold bg-emerald-950/90 border border-emerald-400 text-emerald-200";
            modalQFeedback.textContent = "Excelente! Resposta correta! O oponente foi superado!";
            modalQFeedback.classList.remove('hidden');
            btnContinueGame.classList.remove('hidden');
          } else {
            btn.classList.remove('bg-slate-800', 'border-slate-600');
            btn.classList.add('bg-red-900/80', 'border-red-400', 'text-red-100');

            const reason = (examQ.errorReasons && examQ.errorReasons[idx])
              ? examQ.errorReasons[idx]
              : "A alternativa escolhida não corresponde aos conceitos de Projeto de Vida.";

            applyExamWrongOutcome(`Resposta incorreta! Motivo: ${reason} Leia novamente a dica acima e tente acertá-lo novamente!`);
          }
        });

        modalQOptions.appendChild(btn);
      });

      btnContinueGame.onclick = () => {
        clearQuestionTimer();
        modalQuestion.classList.add('hidden');
        isPaused = false;
        clock.getDelta();

        if (answeredCorrectly) {
          enemyEntity.explodingPending = true;
          setTimeout(() => {
            enemyEntity.defeated = true;
            enemyEntity.rig.group.visible = false;
            spawnNonViolentExplosion(enemyEntity.rig.group.position);

            if (defeatedEnemiesCount >= TOTAL_SECOND_PHASE_QUESTIONS) {
              setTimeout(() => {
                isPaused = true;
                document.getElementById('victory-message').textContent =
                  `Parabéns, ${playerName}! Mostre esta tela para o professor e receba o seu ponto!`;
                document.getElementById('modal-victory').classList.remove('hidden');
              }, 600);
            }
          }, 500);
        }
      };

      modalQuestion.classList.remove('hidden');
    }

    // ==========================================
    // 8. TRANSPARÊNCIA DE OBJETOS
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const currentlyFaded = new Set();
    const targetPosVec = new THREE.Vector3();
    const dirVec = new THREE.Vector3();
    let occlusionFrameCounter = 0;

    function setMeshOpacity(mesh, value) {
      if (Array.isArray(mesh.material)) {
        for (let i = 0; i < mesh.material.length; i++) {
          mesh.material[i].opacity = value;
        }
      } else {
        mesh.material.opacity = value;
      }
    }

    function updateCameraOcclusion() {
      occlusionFrameCounter++;
      if (occlusionFrameCounter % 3 !== 0) return;

      currentlyFaded.forEach(mesh => {
        setMeshOpacity(mesh, 1.0);
      });
      currentlyFaded.clear();

      targetPosVec.set(
        characterGroup.position.x,
        characterGroup.position.y + 1.4,
        characterGroup.position.z
      );

      dirVec.subVectors(targetPosVec, camera.position);
      const distToPlayer = dirVec.length();
      dirVec.divideScalar(distToPlayer);

      raycaster.set(camera.position, dirVec);
      raycaster.far = distToPlayer - 0.4;

      const hits = raycaster.intersectObjects(occludableMeshes, false);
      for (let i = 0; i < hits.length; i++) {
        const hitMesh = hits[i].object;
        setMeshOpacity(hitMesh, 0.25);
        currentlyFaded.add(hitMesh);
      }
    }

    // ==========================================
    // 9. CONTROLES
    // ==========================================
    function setupDpadButton(elementId, directionKey) {
      const btn = document.getElementById(elementId);
      const startPress = (e) => {
        e.preventDefault();
        if (isPaused) return;
        dpadState[directionKey] = true;
        btn.classList.add('active');
      };
      const endPress = (e) => {
        e.preventDefault();
        dpadState[directionKey] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('pointerdown', startPress);
      btn.addEventListener('pointerup', endPress);
      btn.addEventListener('pointerleave', endPress);
      btn.addEventListener('pointercancel', endPress);
    }

    setupDpadButton('btn-left', 'left');
    setupDpadButton('btn-right', 'right');

    document.getElementById('btn-throw').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      throwPVWord();
    });

    window.addEventListener('keydown', (e) => {
      if (isPaused) return;
      if (e.key === ' ' || e.code === 'Space') throwPVWord();
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') dpadState.left = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') dpadState.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') dpadState.left = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') dpadState.right = false;
    });

    // ==========================================
    // 10. LOOP PRINCIPAL DE ANIMAÇÃO
    // ==========================================
    const clock = new THREE.Clock();
    let walkCycle = 0;

    const cameraDistance = 13.5;
    const cameraHeight = 6.8;
    const cameraTargetHeight = 1.6;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      if (isIntroDescent) {
        introElapsed += delta;
        const progress = Math.min(introElapsed / INTRO_DURATION, 1.0);
        const ease = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        characterGroup.position.set(0, INTRO_START_Y * (1 - ease), 5);
        characterGroup.rotation.y = characterAngle;

        const normalCamX = characterGroup.position.x + Math.sin(characterAngle) * -cameraDistance;
        const normalCamY = cameraHeight;
        const normalCamZ = characterGroup.position.z + Math.cos(characterAngle) * -cameraDistance;

        const topCamX = 0;
        const topCamY = 128;
        const topCamZ = -22;

        camera.position.set(
          topCamX + (normalCamX - topCamX) * ease,
          topCamY + (normalCamY - topCamY) * ease,
          topCamZ + (normalCamZ - topCamZ) * ease
        );
        camera.lookAt(
          characterGroup.position.x,
          characterGroup.position.y + cameraTargetHeight,
          characterGroup.position.z
        );

        if (progress >= 1.0) {
          characterGroup.position.set(0, 0, 5);
          isIntroDescent = false;
          isPaused = false;
        }

        renderer.render(scene, camera);
        return;
      }

      if (!isPaused) {
        if (dpadState.left) characterAngle += turnSpeed;
        if (dpadState.right) characterAngle -= turnSpeed;
        characterGroup.rotation.y = characterAngle;

        const isMoving = true;
        const currentMoveSpeed = gamePhase === 2 ? moveSpeed * 0.5 : moveSpeed;
        const desiredX = characterGroup.position.x + Math.sin(characterAngle) * currentMoveSpeed;
        const desiredZ = characterGroup.position.z + Math.cos(characterAngle) * currentMoveSpeed;

        const resolvedPos = resolveHorizontalCollisions(desiredX, desiredZ, characterGroup.position.y);
        characterGroup.position.x = resolvedPos.x;
        characterGroup.position.z = resolvedPos.z;

        const supportY = getSupportFloorHeight(
          characterGroup.position.x,
          characterGroup.position.z,
          characterGroup.position.y
        );

        if (isGrounded && characterGroup.position.y > supportY + 0.01) {
          isGrounded = false;
          verticalVelocity = -0.05;
        }

        if (!isGrounded) {
          characterGroup.position.y += verticalVelocity;
          verticalVelocity += gravity;

          if (characterGroup.position.y <= supportY) {
            characterGroup.position.y = supportY;
            isGrounded = true;
            verticalVelocity = 0;
          }
        } else {
          characterGroup.position.y = supportY;
        }

        if (isMoving) {
          walkCycle += delta * (gamePhase === 2 ? 11 : 18);
          const swingAngle = Math.sin(walkCycle) * 0.65;
          legLeftGroup.rotation.x = swingAngle;
          legRightGroup.rotation.x = -swingAngle;
          armLeftGroup.rotation.x = -swingAngle * 0.85;
          armRightGroup.rotation.x = swingAngle * 0.85;
          torso.position.y = 1.35 + Math.abs(Math.sin(walkCycle * 2)) * 0.06;
          head.rotation.z = Math.sin(walkCycle) * 0.04;
        }

        for (let i = 0; i < collectibleEntities.length; i++) {
          const item = collectibleEntities[i];
          if (item.collected || !item.mesh.visible) continue;
          if (item.cooldown > 0) item.cooldown -= delta;

          item.mesh.rotation.y += delta * 2.2;
          item.mesh.position.y = Math.sin(time * 3 + i) * 0.18;

          if (item.cooldown <= 0) {
            const dist = Math.hypot(
              characterGroup.position.x - item.mesh.position.x,
              characterGroup.position.z - item.mesh.position.z
            );
            if (dist < 1.35) {
              openItemQuestionModal(item);
              break;
            }
          }
        }

        const enemySpeed = gamePhase === 1 ? 0.145 : 0.095;
        const safeMargin = 3.0;
        const innerLimit = CITY_LIMIT - safeMargin;

        for (let i = 0; i < enemyEntities.length; i++) {
          const enemy = enemyEntities[i];
          if (enemy.defeated || enemy.explodingPending) continue;

          const ePos = enemy.rig.group.position;
          const toPlayerX = characterGroup.position.x - ePos.x;
          const toPlayerZ = characterGroup.position.z - ePos.z;
          const distToPlayer = Math.hypot(toPlayerX, toPlayerZ);

          if (gamePhase === 1) {
            if (distToPlayer < 26 && distToPlayer > 0.01) {
              enemy.angle = Math.atan2(toPlayerX, toPlayerZ);
            } else {
              const wp = enemy.route[enemy.waypointIdx];
              const toWpX = wp.x - ePos.x;
              const toWpZ = wp.z - ePos.z;
              if (Math.hypot(toWpX, toWpZ) < 3.0) {
                enemy.waypointIdx = (enemy.waypointIdx + 1) % enemy.route.length;
              } else {
                enemy.angle = Math.atan2(toWpX, toWpZ);
              }
            }
          } else {
            if (distToPlayer < 38 && distToPlayer > 0.01) {
              enemy.angle = Math.atan2(-toPlayerX, -toPlayerZ) + enemy.turnBias * 0.35;
            } else {
              const wp = enemy.route[enemy.waypointIdx];
              const toWpX = wp.x - ePos.x;
              const toWpZ = wp.z - ePos.z;
              if (Math.hypot(toWpX, toWpZ) < 4.0) {
                enemy.waypointIdx = (enemy.waypointIdx + 1) % enemy.route.length;
              } else {
                enemy.angle = Math.atan2(toWpX, toWpZ);
              }
            }
          }

          let dirEX = Math.sin(enemy.angle);
          let dirEZ = Math.cos(enemy.angle);
          let nextEX = ePos.x + dirEX * enemySpeed;
          let nextEZ = ePos.z + dirEZ * enemySpeed;

          let hitWallBorder = false;
          if (nextEX >= innerLimit) {
            nextEX = innerLimit - 0.3;
            dirEX = -Math.abs(dirEX);
            hitWallBorder = true;
          } else if (nextEX <= -innerLimit) {
            nextEX = -innerLimit + 0.3;
            dirEX = Math.abs(dirEX);
            hitWallBorder = true;
          }

          if (nextEZ >= innerLimit) {
            nextEZ = innerLimit - 0.3;
            dirEZ = -Math.abs(dirEZ);
            hitWallBorder = true;
          } else if (nextEZ <= -innerLimit) {
            nextEZ = -innerLimit + 0.3;
            dirEZ = Math.abs(dirEZ);
            hitWallBorder = true;
          }

          if (hitWallBorder) {
            const toCenterX = -ePos.x;
            const toCenterZ = -ePos.z;
            const centerLen = Math.hypot(toCenterX, toCenterZ) || 1;
            dirEX = dirEX * 0.6 + (toCenterX / centerLen) * 0.4;
            dirEZ = dirEZ * 0.6 + (toCenterZ / centerLen) * 0.4;
            enemy.angle = Math.atan2(dirEX, dirEZ);
            enemy.waypointIdx = (enemy.waypointIdx + 1) % enemy.route.length;
            nextEX = ePos.x + Math.sin(enemy.angle) * enemySpeed;
            nextEZ = ePos.z + Math.cos(enemy.angle) * enemySpeed;
          }

          const resolvedE = resolveHorizontalCollisions(nextEX, nextEZ, 0);

          if (Math.hypot(resolvedE.x - nextEX, resolvedE.z - nextEZ) > 0.05) {
            enemy.angle += enemy.turnBias * Math.PI * 0.9;
          }

          ePos.x = Math.max(-innerLimit, Math.min(innerLimit, resolvedE.x));
          ePos.z = Math.max(-innerLimit, Math.min(innerLimit, resolvedE.z));
          enemy.rig.group.rotation.y = enemy.angle;

          enemy.walkCycle += delta * 15;
          const eSwing = Math.sin(enemy.walkCycle) * 0.6;
          enemy.rig.legLeftGroup.rotation.x = eSwing;
          enemy.rig.legRightGroup.rotation.x = -eSwing;
          enemy.rig.armLeftGroup.rotation.x = -eSwing * 0.85;
          enemy.rig.armRightGroup.rotation.x = eSwing * 0.85;

          if (gamePhase === 1 && distToPlayer < 1.05) {
            const teleportSpot = getRandomFreeSpot(35);
            characterGroup.position.set(teleportSpot.x, 0, teleportSpot.z);
            showToast("Um oponente encostou em você! Você foi teletransportado para outro ponto da cidade!");
            break;
          }
        }

        const projSpeed = 1.15;
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const proj = projectiles[i];
          proj.mesh.position.x += proj.dirX * projSpeed;
          proj.mesh.position.z += proj.dirZ * projSpeed;
          proj.traveled += projSpeed;

          let hitEnemy = null;
          for (let j = 0; j < enemyEntities.length; j++) {
            const enemy = enemyEntities[j];
            if (enemy.defeated || enemy.explodingPending) continue;
            const d = Math.hypot(
              proj.mesh.position.x - enemy.rig.group.position.x,
              proj.mesh.position.z - enemy.rig.group.position.z
            );
            if (d < 1.45) {
              hitEnemy = enemy;
              break;
            }
          }

          if (hitEnemy) {
            scene.remove(proj.mesh);
            projectiles.splice(i, 1);
            openEnemyExamModal(hitEnemy);
            break;
          }

          if (proj.traveled >= proj.maxDistance) {
            scene.remove(proj.mesh);
            projectiles.splice(i, 1);
          }
        }

      }

      for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const pt = explosionParticles[i];
        pt.mesh.position.x += pt.vx;
        pt.mesh.position.y += pt.vy;
        pt.mesh.position.z += pt.vz;
        pt.vy -= 0.008;
        pt.life -= delta * 1.4;
        pt.mesh.material.opacity = Math.max(0, pt.life);

        if (pt.life <= 0) {
          scene.remove(pt.mesh);
          pt.mesh.material.dispose();
          explosionParticles.splice(i, 1);
        }
      }

      const camOffsetX = Math.sin(characterAngle) * -cameraDistance;
      const camOffsetZ = Math.cos(characterAngle) * -cameraDistance;
      const targetCamX = characterGroup.position.x + camOffsetX;
      const targetCamY = characterGroup.position.y + cameraHeight;
      const targetCamZ = characterGroup.position.z + camOffsetZ;

      camera.position.x += (targetCamX - camera.position.x) * 0.16;
      camera.position.y += (targetCamY - camera.position.y) * 0.16;
      camera.position.z += (targetCamZ - camera.position.z) * 0.16;
      camera.lookAt(
        characterGroup.position.x,
        characterGroup.position.y + cameraTargetHeight,
        characterGroup.position.z
      );

      updateCameraOcclusion();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = () => {
      animate();
    };
  </script>
</body>
