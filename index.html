<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Jogo Educativo - Tarefa SP 4">
  <title>Tarefa SP 4 - Portal de Jogos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      font-family: Arial, Helvetica, sans-serif;
    }

    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 600px;
      width: 100%;
    }

    header h1 {
      color: #facc15;
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-shadow: 2px 2px #000;
      text-transform: uppercase;
    }

    header p {
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-card {
      background: #1e293b;
      border: 3px solid #facc15;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      transition: transform 0.2s, border-color 0.2s;
    }

    .game-card:active, .game-card:hover {
      transform: scale(0.98);
      border-color: #ffffff;
    }

    .game-info {
      flex: 1;
      padding-right: 12px;
    }

    .game-info h2 {
      font-size: 1.3rem;
      color: #facc15;
      margin-bottom: 6px;
    }

    .game-info p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .btn-play {
      background: #facc15;
      color: #000000;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: center;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      color: #64748b;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portal Educativo 🎮</h1>
    <p>Clique abaixo para iniciar o jogo:</p>
  </header>

  <div class="container">
    
    <!-- Tarefa SP 4 -->
    <a href="tarefa-sp-quatro.html" class="game-card">
      <div class="game-info">
        <h2>Tarefa SP 4 🎓</h2>
        <p>Acesse a plataforma e inicie a atividade do jogo Tarefa SP 4.</p>
      </div>
      <span class="btn-play">JOGAR ➔</span>
    </a>

  </div>

  <footer>
    Plataforma Educativa Offline & PWA
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.error('Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>
