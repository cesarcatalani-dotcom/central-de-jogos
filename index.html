<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Jogos Filosóficos & Educativos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 600px;
    }

    h1 {
      color: #facc15;
      font-size: 2rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
    }

    .game-card:hover {
      transform: translateY(-2px);
      border-color: #facc15;
    }

    .game-info h2 {
      font-size: 1.25rem;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .game-info p {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .btn-play {
      background: #facc15;
      color: #0f172a;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-transform: uppercase;
      white-space: nowrap;
      margin-left: 12px;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portal de Jogos Educativos 🎮</h1>
    <p class="subtitle">Selecione uma das jornadas filosóficas para jogar:</p>
  </header>

  <div class="container">
    
    <!-- Novo Jogo Adicionado -->
    <a href="tarefa-sp-dois.html" class="game-card">
      <div class="game-info">
        <h2>Tarefa SP 2 🌿🍄</h2>
        <p>A Retomada da Terra (Michel Serres, Ailton Krenak e Nego Bispo)</p>
      </div>
      <span class="btn-play">Jogar ➔</span>
    </a>

    <!-- Exemplo de jogos anteriores se existirem no seu projeto -->
    <a href="jornada-guardiao.html" class="game-card">
      <div class="game-info">
        <h2>Super Guardião Bros 🛡️</h2>
        <p>Jornada de Aprendizado e Plataforma</p>
      </div>
      <span class="btn-play">Jogar ➔</span>
    </a>

  </div>

  <footer>
    Plataforma Educativa Offline & PWA • 2026
  </footer>

  <script>
    // Registro do Service Worker para suporte Offline (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso!', reg))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
