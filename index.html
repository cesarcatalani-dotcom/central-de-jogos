<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Central de Jogos - Prof. Cesar</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-card {
            background: #1e293b;
            border: 3px solid #facc15;
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { color: #facc15; font-size: 22px; margin-bottom: 8px; }
        p { color: #cbd5e1; font-size: 14px; margin-bottom: 20px; }
        
        .btn-install {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
            display: none;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .game-card {
            background: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .game-card:active { transform: scale(0.98); }
        .game-badge { background: #3b82f6; font-size: 12px; padding: 6px 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>Central de Jogos 🎮</h1>
        <p>Prof. Cesar — Ensino Fundamental</p>

        <!-- Botão para instalar o ícone no Android -->
        <button id="btn-install" class="btn-install">📲 ADICIONAR À TELA INICIAL</button>

        <div style="text-align: left; margin-bottom: 10px; font-weight: bold; color: #facc15;">
            Selecione o jogo da aula:
        </div>

        <div class="game-list">
            <!-- JOGO 1: EMPATIA -->
            <a href="jogos/mario-empatia.html" class="game-card">
                <span>🤝 Super Mário: Empatia (8º Ano)</span>
                <span class="game-badge">JOGAR ➔</span>
            </a>

            <!-- Quando criar novos jogos, basta colar novos botões aqui! -->
        </div>
    </div>

<script>
    let deferredPrompt;
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstall.style.display = 'block';
    });

    btnInstall.addEventListener('click', () => {
        btnInstall.style.display = 'none';
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
            });
        }
    });
</script>
</body>
</html>
