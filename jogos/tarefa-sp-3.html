<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Mariofia: A Sociedade Pós-Moderna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #090d16;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
        }

        /* TELA DE INÍCIO / REGISTRO DE NOME */
        #start-screen {
            position: fixed;
            inset: 0;
            width: 100dvw;
            height: 100dvh;
            background: #0f172a;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        #start-card {
            background: #1e293b;
            border: 3px solid #facc15;
            border-radius: 16px;
            padding: 25px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #start-card h1 {
            color: #facc15;
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }

        #student-name {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #facc15;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: #facc15;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* LAYOUT INTEGRAL DO JOGO */
        #game-layout {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            flex-direction: row;
            background: #111827;
            z-index: 999999;
        }

        #canvas-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            background: #38bdf8;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud-top {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .hud-badge {
            background: rgba(0, 0, 0, 0.85);
            color: #facc15;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #facc15;
        }

        /* CONTROLES FIXOS À DIREITA */
        #controls-sidebar {
            width: 140px;
            height: 100%;
            background: #0f172a;
            border-left: 3px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 8px;
            flex-shrink: 0;
            z-index: 20;
        }

        .ctrl-title {
            color: #facc15;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            width: 100%;
        }

        .controls-pad {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .dir-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            background: #1e293b;
            color: #ffffff;
            border: 2px solid #facc15;
            border-radius: 8px;
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:active {
            background: #facc15;
            color: #000;
        }

        .btn-jump-action {
            background: #ef4444;
            border-color: #ffffff;
            font-size: 14px;
            padding: 16px 0;
            width: 100%;
        }

        .btn-jump-action:active {
            background: #f87171;
        }

        /* MODAIS DE DICAS E PERGUNTAS (SEM ROLAGEM) */
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000001;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .modal-box {
            background: #0f172a;
            border: 3px solid #facc15;
            border-radius: 12px;
            width: 95%;
            max-width: 480px;
            padding: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-header {
            color: #facc15;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        .modal-body {
            background: #1e293b;
            border-left: 4px solid #facc15;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            color: #fff;
        }

        .prof-note {
            background: #334155;
            color: #facc15;
            font-size: 12px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-opt {
            background: #1e293b;
            border: 1px solid #64748b;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }

        .btn-opt:hover {
            border-color: #facc15;
            background: #334155;
        }

        .btn-next {
            background: #facc15;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-error-reset {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            margin-top: 10px;
        }

        /* NOTIFICAÇÕES TOAST */
        #toast {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #ef4444;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000002;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- TELA DE INÍCIO -->
    <div id="start-screen">
        <div id="start-card">
            <h1>Super Mariofia 🍄👁️</h1>
            <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px;">Aprenda Filosofia Jogando!</p>
            <input type="text" id="student-name" placeholder="Digite seu nome aqui..." maxlength="30">
            <button class="btn-main" onclick="startGame()">Começar Jogo ➔</button>
        </div>
    </div>

    <!-- ESTRUTURA DO JOGO -->
    <div id="game-layout">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="hud-top">
                <div class="hud-badge" id="hud-name">Aluno: --</div>
                <div class="hud-badge" id="hud-score">Dicas: 0 / 12</div>
            </div>
        </div>

        <!-- CONTROLES FIXOS À DIREITA -->
        <div id="controls-sidebar">
            <div class="ctrl-title">CONTROLES</div>
            <div class="controls-pad">
                <div class="dir-row">
                    <button class="btn-action" id="btn-left">◀</button>
                    <button class="btn-action" id="btn-right">▶</button>
                </div>
                <button class="btn-action btn-jump-action" id="btn-up">🚀 PULAR</button>
            </div>
            <div style="font-size: 9px; color: #64748b; text-align: center;">Teclado: ◄ ► ▲</div>
        </div>
    </div>

    <!-- MODAL DE DICA E PERGUNTA (2 ETAPAS) -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-content"></div>
    </div>

    <div id="toast"></div>

            { q: "Juntar várias matérias (como história, ciência e arte) serve para:", options: ["Aprender de verdade e resolver problemas reais", "Passar o tempo sem pensar", "Deixar os livros mais pesados"], correct: 0 }
        ]
    }
];

// VARIÁVEIS DE ESTADO
let studentName = "";
let currentStep = 0;
let currentLessonIdx = null;
let currentQuestionObj = null;

let canvas, ctx;
let gameState = 'START';
let hitCount = 0;
let unlockedTips = new Array(12).fill(false);

let cameraX = 0;
let cameraY = 0;
let shakeTime = 0;

// JOGADOR
const player = {
    x: 40,
    y: 350,
    width: 24,
    height: 32,
    vx: 0,
    vy: 0,
    speed: 4.2,
    jumpPower: -11.5,
    grounded: false
};

const keys = { right: false, left: false, up: false };

let platforms = [];
let enemy = null; // EXATAMENTE 1 INIMIGO

function initWorld() {
    platforms = [
        { x: 0, y: 400, width: 6000, height: 60, type: 'ground' },

        // 12 BLOCOS COM DICA + 24 BLOCOS VAZIOS INTERCALADOS
        { x: 220, y: 290, width: 34, height: 34, type: 'block', id: 0, hit: false },
        { x: 300, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 420, y: 290, width: 34, height: 34, type: 'block', id: 1, hit: false },
        { x: 500, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 620, y: 290, width: 34, height: 34, type: 'block', id: 2, hit: false },
        { x: 700, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        // ELEVAÇÃO (1 Pedra) -> Bloco Dica 4
        { x: 820, y: 310, width: 60, height: 20, type: 'stone' },
        { x: 833, y: 190, width: 34, height: 34, type: 'block', id: 3, hit: false },
        { x: 920, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 1040, y: 290, width: 34, height: 34, type: 'block', id: 4, hit: false },
        { x: 1120, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 1240, y: 290, width: 34, height: 34, type: 'block', id: 5, hit: false },
        { x: 1320, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        // ELEVAÇÃO (1 Pedra) -> Bloco Dica 7
        { x: 1440, y: 310, width: 60, height: 20, type: 'stone' },
        { x: 1453, y: 190, width: 34, height: 34, type: 'block', id: 6, hit: false },
        { x: 1540, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 1660, y: 290, width: 34, height: 34, type: 'block', id: 7, hit: false },
        { x: 1740, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        // ELEVAÇÃO (2 Pedras Empilhadas) -> Bloco Dica 9
        { x: 1860, y: 320, width: 60, height: 20, type: 'stone' },
        { x: 1920, y: 240, width: 60, height: 20, type: 'stone' },
        { x: 1933, y: 120, width: 34, height: 34, type: 'block', id: 8, hit: false },

        { x: 2080, y: 290, width: 34, height: 34, type: 'block', id: 9, hit: false },
        { x: 2160, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        { x: 2280, y: 290, width: 34, height: 34, type: 'block', id: 10, hit: false },
        { x: 2360, y: 290, width: 34, height: 34, type: 'empty', hit: false },

        // ELEVAÇÃO (2 Pedras Empilhadas) -> Bloco Dica 12
        { x: 2480, y: 320, width: 60, height: 20, type: 'stone' },
        { x: 2540, y: 240, width: 60, height: 20, type: 'stone' },
        { x: 2553, y: 120, width: 34, height: 34, type: 'block', id: 11, hit: false },

        // PEDRAS ADICIONAIS VAZIAS E ELEVADAS
        { x: 2700, y: 290, width: 34, height: 34, type: 'empty', hit: false },
        { x: 2800, y: 310, width: 60, height: 20, type: 'stone' },
        { x: 2813, y: 200, width: 34, height: 34, type: 'empty', hit: false },

        { x: 2950, y: 310, width: 60, height: 20, type: 'stone' },
        { x: 2963, y: 200, width: 34, height: 34, type: 'empty', hit: false },

        { x: 3100, y: 320, width: 60, height: 20, type: 'stone' },
        { x: 3160, y: 240, width: 60, height: 20, type: 'stone' },
        { x: 3173, y: 120, width: 34, height: 34, type: 'empty', hit: false },

        // BANDEIRA DE CHEGADA
        { x: 3400, y: 200, width: 10, height: 200, type: 'pole' },
        { x: 3410, y: 200, width: 45, height: 30, type: 'flag' }
    ];

    // APENAS 1 INIMIGO PERCORRENDO DEVAGAR TODO O CENÁRIO (DA DIREITA PARA A ESQUERDA E VICE-VERSA)
    enemy = {
        x: 3300,
        y: 376,
        width: 24,
        height: 24,
        speed: -1.2,
        minX: 100,
        maxX: 3350
    };
}

// EVENTOS DE TECLADO E TOQUE
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
        if (!keys.up && player.grounded && gameState === 'PLAYING') {
            player.vy = player.jumpPower;
            player.grounded = false;
        }
        keys.up = true;
    }
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
});

function bindTouchBtn(id, keyName) {
    const btn = document.getElementById(id);
    const press = (e) => {
        e.preventDefault();
        if (keyName === 'up') {
            if (player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
            }
        }
        keys[keyName] = true;
    };
    const release = (e) => {
        e.preventDefault();
        keys[keyName] = false;
    };
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
}

bindTouchBtn('btn-left', 'left');
bindTouchBtn('btn-right', 'right');
bindTouchBtn('btn-up', 'up');

function startGame() {
    const input = document.getElementById('student-name').value.trim();
    if (!input) {
        alert("Por favor, digite seu nome antes de começar!");
        return;
    }
    studentName = input;
    document.getElementById('hud-name').innerText = `Aluno: ${studentName}`;

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-layout').style.display = 'flex';

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    initWorld();
    gameState = 'PLAYING';
    gameLoop();
}

function resizeCanvas() {
    if (!canvas) return;
    const wrapper = document.getElementById('canvas-wrapper');
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
}

function update() {
    if (gameState !== 'PLAYING') return;

    if (keys.right) player.vx = player.speed;
    else if (keys.left) player.vx = -player.speed;
    else player.vx = 0;

    player.vy += 0.52;

    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    player.grounded = false;

    platforms.forEach(p => {
        if (player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y) {

            if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 12) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
            else if (player.vy < 0 && player.y - player.vy >= p.y + p.height - 12) {
                player.y = p.y + p.height;
                player.vy = 0;

                if (p.type === 'block' && !p.hit) {
                    p.hit = true;
                    openLessonModal(p.id);
                } else if (p.type === 'empty' && !p.hit) {
                    p.hit = true;
                    showToast("Nenhuma dica aqui!");
                }
            }
            else if (p.type === 'pole' && hitCount < 12) {
                if (player.vx > 0) player.x = p.x - player.width;
            }
        }
    });

    // 1 INIMIGO PERCORRE TODO O CENÁRIO (VAI E VOLTA)
    if (enemy) {
        enemy.x += enemy.speed;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
            enemy.speed *= -1;
        }

        if (player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y) {
            
            showToast("Tente novamente!");
            player.x = Math.max(40, player.x - 150);
            player.y = 300;
        }
    }

    cameraX = player.x - canvas.width * 0.35;
    if (cameraX < 0) cameraX = 0;

    cameraY = player.y - canvas.height * 0.65;
    if (cameraY > 100) cameraY = 100;

    if (player.x >= 3410 && hitCount >= 12 && gameState !== 'WIN') {
        gameState = 'WIN';
    }

    if (gameState === 'WIN') shakeTime += 0.2;
}

function draw() {
    if (!ctx) return;

    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    platforms.forEach(p => {
        if (p.type === 'ground') {
            ctx.fillStyle = '#b45309';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(p.x, p.y, p.width, 8);
        } else if (p.type === 'stone') {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#0f172a';
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'block' || p.type === 'empty') {
            ctx.fillStyle = p.hit ? '#78350f' : '#facc15';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.width, p.height);

            if (!p.hit) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('?', p.x + 11, p.y + 24);
            }
        } else if (p.type === 'pole') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'flag') {
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.width, p.y + p.height / 2);
            ctx.lineTo(p.x, p.y + p.height);
            ctx.fill();
        }
    });

    // UNICO INIMIGO
    if (enemy) {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(enemy.x + 4, enemy.y + 4, 4, 4);
        ctx.fillRect(enemy.x + 14, enemy.y + 4, 4, 4);
    }

    // PERSONAGEM (MÁRIO)
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(player.x + 2, player.y + 16, player.width - 4, 12);
    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(player.x + 4, player.y + 6, 16, 10);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x + 6, player.y + 12, 12, 3);

    ctx.restore();

    if (gameState === 'WIN') {
        let shakeX = Math.sin(shakeTime * 10) * 8;
        let shakeY = Math.cos(shakeTime * 10) * 8;

        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2 + shakeX, canvas.height * 0.35 + shakeY);
        ctx.font = '900 48px Arial, sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.strokeText('Farmei!', 0, 0);
        ctx.fillText('Farmei!', 0, 0);
        ctx.restore();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(20, canvas.height * 0.55, canvas.width - 40, 60);
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.strokeRect(20, canvas.height * 0.55, canvas.width - 40, 60);

        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.fillStyle = '#22c55e';
        ctx.textAlign = 'center';
        ctx.fillText(`Farmou, ${studentName}! Vá até o professor para receber o ponto!`, canvas.width / 2, canvas.height * 0.55 + 35);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function openLessonModal(idx) {
    gameState = 'PAUSED';
    currentLessonIdx = idx;
    currentStep = 0;

    const item = database[idx];
    const qRandIdx = Math.floor(Math.random() * item.questions.length);
    currentQuestionObj = item.questions[qRandIdx];

    renderModalContent();
    document.getElementById('modal-overlay').style.display = 'flex';
}

function renderModalContent() {
    const box = document.getElementById('modal-content');
    box.innerHTML = '';

    if (currentStep === 0) {
        box.innerHTML = `
            <div class="modal-header">Lição ${currentLessonIdx + 1} de 12</div>
            <div class="modal-body">${database[currentLessonIdx].lesson}</div>
            <div class="prof-note">💬 Não entendeu? Pergunte ao professor.</div>
            <button class="btn-next" onclick="goToStep2()">Avançar ➔</button>
        `;
    } else {
        let opts = currentQuestionObj.options.map((opt, i) => ({
            text: opt,
            isCorrect: i === currentQuestionObj.correct
        }));

        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }

        let optsHTML = opts.map(o => `
            <button class="btn-opt" onclick="answerQuestion(${o.isCorrect})">${o.text}</button>
        `).join('');

        box.innerHTML = `
            <div class="modal-header">Verificação de Leitura 📝</div>
            <div style="font-size: 14px; font-weight: bold; color: #fff;">${currentQuestionObj.q}</div>
            <div class="options-list">${optsHTML}</div>
        `;
    }
}

function goToStep2() {
    currentStep = 1;
    renderModalContent();
}

function answerQuestion(isCorrect) {
    if (isCorrect) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (!unlockedTips[currentLessonIdx]) {
            unlockedTips[currentLessonIdx] = true;
            hitCount++;
            document.getElementById('hud-score').innerText = `Dicas: ${hitCount} / 12`;
        }
        gameState = 'PLAYING';
    } else {
        showErrorScreen();
    }
}

function showErrorScreen() {
    const box = document.getElementById('modal-content');
    box.innerHTML = `
        <div class="modal-header" style="color: #ef4444;">Atenção! ⚠️</div>
        <div class="modal-body" style="border-left-color: #ef4444; font-weight: bold; text-align: center;">
            Você errou! Volte 2 perguntas e leia as Lições com atenção!
        </div>
        <button class="btn-error-reset" onclick="confirmPenalizeTwoQuestions()">CONTINUAR ➔</button>
    `;
}

function confirmPenalizeTwoQuestions() {
    document.getElementById('modal-overlay').style.display = 'none';
    penalizeTwoQuestions();
}

function penalizeTwoQuestions() {
    let currentBlock = platforms.find(p => p.type === 'block' && p.id === currentLessonIdx);
    if (currentBlock) currentBlock.hit = false;

    let targetIdx = Math.max(0, currentLessonIdx - 2);

    for (let i = targetIdx; i <= currentLessonIdx; i++) {
        if (unlockedTips[i]) {
            unlockedTips[i] = false;
            hitCount = Math.max(0, hitCount - 1);
        }
        let blockToReset = platforms.find(p => p.type === 'block' && p.id === i);
        if (blockToReset) blockToReset.hit = false;
    }

    document.getElementById('hud-score').innerText = `Dicas: ${hitCount} / 12`;

    let targetBlock = platforms.find(p => p.type === 'block' && p.id === targetIdx);
    if (targetBlock) {
        player.x = Math.max(40, targetBlock.x - 80);
        player.y = 350;
    } else {
        player.x = 40;
        player.y = 350;
    }

    player.vx = 0;
    player.vy = 0;
    gameState = 'PLAYING';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => {
        t.style.display = 'none';
    }, 1800);
}
</script>
