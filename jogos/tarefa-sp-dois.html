<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Guardião Bros: A Retomada da Terra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #090d16;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
        }

        /* TELA DE INÍCIO */
        #start-screen {
            position: fixed;
            inset: 0;
            width: 100dvw;
            height: 100dvh;
            background: #0f172a;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        #start-card {
            background: #1e293b;
            border: 3px solid #facc15;
            border-radius: 16px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #start-card h1 {
            color: #facc15;
            font-size: 22px;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
        }

        #student-name {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #facc15;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }

        .phase-select {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-phase {
            flex: 1;
            padding: 12px;
            background: #334155;
            color: #fff;
            border: 2px solid #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        .btn-phase.active {
            background: #15803d;
            border-color: #4ade80;
            color: #fff;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: #facc15;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* LAYOUT INTEGRAL DO JOGO */
        #game-layout {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            flex-direction: row;
            background: #111827;
            z-index: 999999;
        }

        #canvas-wrapper {
            flex: 1;
            height: 100%;
            position: relative;
            background: #38bdf8;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud-top {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .hud-badge {
            background: rgba(0, 0, 0, 0.85);
            color: #facc15;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #facc15;
        }

        /* CONTROLES DIREITA */
        #controls-sidebar {
            width: 140px;
            height: 100%;
            background: #0f172a;
            border-left: 3px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 8px;
            flex-shrink: 0;
            z-index: 20;
        }

        .ctrl-title {
            color: #facc15;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            width: 100%;
        }

        .controls-pad {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .dir-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            background: #1e293b;
            color: #ffffff;
            border: 2px solid #facc15;
            border-radius: 8px;
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:active {
            background: #facc15;
            color: #000;
        }

        .btn-jump-action {
            background: #ef4444;
            border-color: #ffffff;
            font-size: 14px;
            padding: 16px 0;
            width: 100%;
        }

        .btn-jump-action:active {
            background: #f87171;
        }

        /* MODAL DE LIÇÕES */
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000001;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .modal-box {
            background: #0f172a;
            border: 3px solid #facc15;
            border-radius: 12px;
            width: 95%;
            max-width: 480px;
            padding: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-header {
            color: #facc15;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        .modal-body {
            background: #1e293b;
            border-left: 4px solid #facc15;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            color: #fff;
        }

        .prof-note {
            background: #334155;
            color: #facc15;
            font-size: 12px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-opt {
            background: #1e293b;
            border: 1px solid #64748b;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }

        .btn-opt:hover {
            border-color: #facc15;
            background: #334155;
        }

        .btn-next {
            background: #facc15;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-error-reset {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            margin-top: 10px;
        }

        /* TELA DO SIMULADO INTEGRAL (8 QUESTÕES) */
        #saresp-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f172a;
            z-index: 1000005;
            overflow-y: auto;
            padding: 20px;
        }

        .saresp-container {
            max-width: 650px;
            margin: 0 auto;
            background: #1e293b;
            border: 3px solid #38bdf8;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .saresp-banner {
            background: #facc15;
            color: #000;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            text-transform: uppercase;
        }

        .saresp-section-title {
            background: #0284c7;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .saresp-q-box {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saresp-q-text {
            font-size: 14px;
            line-height: 1.5;
            color: #f8fafc;
            white-space: pre-line;
        }

        .saresp-opt {
            background: #1e293b;
            border: 2px solid #64748b;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .saresp-opt.selected {
            border-color: #facc15;
            background: #334155;
        }

        .btn-submit-saresp {
            background: #22c55e;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* GABARITO FINAL */
        .gabarito-box {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            border: 2px solid #22c55e;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gabarito-item {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border-left: 5px solid #64748b;
            font-size: 13px;
            line-height: 1.4;
        }

        .gabarito-item.correct { border-left-color: #22c55e; }
        .gabarito-item.wrong { border-left-color: #ef4444; }

        .final-msg {
            background: #facc15;
            color: #000;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        #toast {
            display: none;
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #ef4444;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000002;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- TELA DE INÍCIO -->
    <div id="start-screen">
        <div id="start-card">
            <h1>Super Guardião Bros 🌿🍄</h1>
            <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 12px; font-weight: bold;">A Retomada da Terra (Filosofia Ambiental e decolonial)</p>
            
            <input type="text" id="student-name" placeholder="Digite seu nome aqui..." maxlength="30">
            
            <p style="font-size: 11px; color: #facc15; margin-bottom: 6px; text-align: left; font-weight: bold;">Iniciar pela Fase:</p>
            <div class="phase-select">
                <button class="btn-phase active" id="btn-p1" onclick="selectPhase(1)">Fase 1: O Contrato Natural & Gaia (Serres e Krenak)</button>
                <button class="btn-phase" id="btn-p2" onclick="selectPhase(2)">Fase 2: Retomada & Resistência (Nego Bispo)</button>
            </div>

            <button class="btn-main" onclick="startGame()">Começar Jogo ➔</button>
        </div>
    </div>

    <!-- ESTRUTURA DO JOGO -->
    <div id="game-layout">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="hud-top">
                <div class="hud-badge" id="hud-name">Aluno: --</div>
                <div class="hud-badge" id="hud-phase">Fase 1</div>
                <div class="hud-badge" id="hud-score">Dicas: 0 / 12</div>
            </div>
        </div>

        <!-- CONTROLES -->
        <div id="controls-sidebar">
            <div class="ctrl-title">CONTROLES</div>
            <div class="controls-pad">
                <div class="dir-row">
                    <button class="btn-action" id="btn-left">◀</button>
                    <button class="btn-action" id="btn-right">▶</button>
                </div>
                <button class="btn-action btn-jump-action" id="btn-up">🚀 PULAR</button>
            </div>
            <div style="font-size: 9px; color: #64748b; text-align: center;">Teclado: ◄ ► ▲</div>
        </div>
    </div>

    <!-- MODAL DE LIÇÕES -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-content"></div>
    </div>

    <!-- TELA DO SIMULADO COMPLETO (8 QUESTÕES) -->
    <div id="saresp-overlay">
        <div class="saresp-container" id="saresp-content">
            <div class="saresp-banner">Simulado Retomada da Terra — 8 Questões Final</div>
            <div id="saresp-questions"></div>
            <button class="btn-submit-saresp" onclick="submitSaresp()">FINALIZAR SIMULADO ➔</button>
        </div>
    </div>

    <div id="toast"></div>

<script>
let selectedPhase = 1;

// ==========================================
// LIÇÕES FASE 1: SERRES E KRENAK (O CONTRATO NATURAL & GAIA)
// ==========================================
const databaseFase1 = [
    {
        lesson: "📖 Lição 1: POLUIÇÃO MORAL — Michel Serres explica que antes da poluição física dos rios e do ar, existe uma 'Poluição Moral': a atitude mental de ganância e a ideia arrogante de que o ser humano é dono e proprietário da Terra.",
        questions: [
            { q: "Qual é a causa invisível da degradação do planeta segundo Michel Serres?", options: ["A Poluição Moral (ideia de domínio e ganância sobre a Terra)", "A falta de tecnologia industrial nas fábricas", "O excesso de chuvas nas florestas"], correct: 0 },
            { q: "A Poluição Moral se manifesta principalmente no:", options: ["Desejo descontrolado de apropriação e exploração da natureza", "Hábito de ler livros de filosofia", "Cuidado comunitário das hortas"], correct: 0 },
            { q: "Para Michel Serres, a poluição física do meio ambiente é uma consequência da:", options: ["Poluição Moral prévia da humanidade", "Mágica do tempo", "Falta de carros elétricos"], correct: 0 },
            { q: "Superar a Poluição Moral exige mudar nossa:", options: ["Relação de domínio e posse para uma relação de respeito com a Terra", "Produção de plásticos para o dobro", "Falta de vontade de trabalhar"], correct: 0 },
            { q: "A arrogância de se considerar proprietário absoluto da natureza é chamada por Serres de:", options: ["Poluição Moral", "Preservação Ecológica", "Contrato Natural"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 2: O CONTRATO NATURAL — Para salvar o meio ambiente, Michel Serres propõe assinar um 'Contrato Natural', superando o Contrato Social que só incluía humanos. A Terra passa a ser reconhecida como Sujeito de Direito.",
        questions: [
            { q: "O que propõe o 'Contrato Natural' de Michel Serres?", options: ["Tratar a Terra como Sujeito de Direito e parceira da humanidade", "Vender os oceanos para empresas privadas", "Aumentar as guerras por recursos naturais"], correct: 0 },
            { q: "Qual a limitação do antigo 'Contrato Social' criticada por Serres?", options: ["Ele só considerava as relações entre os homens e excluía a natureza", "Ele proibia as pessoas de trabalharem", "Ele foi escrito em latim antigo"], correct: 0 },
            { q: "Reconhecer a natureza como 'Sujeito de Direito' significa que ela:", options: ["Possui valor próprio e direito à proteção jurídica e preservação", "Pode ser comprada no mercado financeiro", "Não tem importância para a ciência"], correct: 0 },
            { q: "O Contrato Natural estabelece entre o homem e a Terra um vínculo de:", options: ["Reciprocidade e equilíbrio em vez de exploração destrutiva", "Posse e dominação ilimitada", "Indiferença total"], correct: 0 },
            { q: "Celebrar o Contrato Natural é indispensável para:", options: ["Garantir a sobrevivência da vida e do planeta no futuro", "Aumentar o consumo de energia fóssil", "Isolar os países ricos"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 3: CRÍTICA AO ANTROPOCENTRISMO — Ailton Krenak critica o Antropocentrismo (a ilusão de que o homem é o centro de tudo e dono de todas as criaturas). Isso separou a humanidade do resto da vida.",
        questions: [
            { q: "O que Ailton Krenak critica rigorosamente em seu pensamento?", options: ["O Antropocentrismo que coloca o ser humano como superior a tudo", "O reflorestamento das florestas tropicais", "A vida em comunidade dos povos indígenas"], correct: 0 },
            { q: "A ilusão antropocêntrica faz a humanidade acreditar que a natureza é apenas:", options: ["Um estoque infinito de recursos para ser explorado e vendido", "Um organismo sagrado e vivo", "Sua grande mãe protetora"], correct: 0 },
            { q: "Ao se afastar da Terra, o ser humano ocidental provocou um divórcio entre:", options: ["A humanidade e a própria vida na Terra", "A tecnologia e os videogames", "Os rios e os oceanos"], correct: 0 },
            { q: "Superar a visão antropocêntrica exige reconhecer que os humanos são:", options: ["Apenas uma parte integrante da vasta teia da vida", "Os reis absolutos do universo", "Incapazes de viver em sociedade"], correct: 0 },
            { q: "A crítica de Krenak ao antropocentrismo nos convida a reatar nossa conexão com:", options: ["A mãe Terra e os seres não humanos", "A produção de mercadorias em massa", "A vida isolada nas metrópoles"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 4: A TERRA COMO GAIA — Krenak defende que a Terra não é uma coisa inanimada, mas GAIA: um organismo vivo, sagrado e consciente, do qual os rios e montanhas são nossos parentes.",
        questions: [
            { q: "Como Ailton Krenak e a visão de Gaia concebem o planeta Terra?", options: ["Como um organismo vivo, vivo e sagrado, do qual fazemos parte", "Como uma grande rocha morta e sem valor", "Como um shopping center de matérias-primas"], correct: 0 },
            { q: "Na cosmovisão dos povos originários defendida por Krenak, as montanhas e rios são:", options: ["Nossos parentes com os quais nos relacionamos com afeto", "Depósitos de minério de ferro para extração rápida", "Propriedades privadas sem vida"], correct: 0 },
            { q: "Considerar a Terra como Gaia exige uma atitude de:", options: ["Cuidado, respeito e pertencimento espiritual e ecológico", "Exploração acelerada antes que os recursos acabem", "Apatia e abandono"], correct: 0 },
            { q: "Quando poluímos um rio sagrado (como o Rio Doce), estamos atingindo:", options: ["A nossa própria família e a integridade de Gaia", "Apenas uma poça de água sem importância", "Um objeto plástico"], correct: 0 },
            { q: "A perspectiva de Gaia contrapõe-se à ideia moderna de ver a Terra como:", options: ["Mercadoria e recurso comercializável", "Organismo vivo e integrado", "Lugar de união da vida"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 5: A IDEIA DE HUMANIDADE UNIFORME — Krenak denuncia que o capitalismo tenta criar uma 'Humanidade Uniforme' e homogênea, que consome as mesmas coisas e destrói as diferenças culturais.",
        questions: [
            { q: "O que Krenak denuncia sobre o modelo globalizado de 'Humanidade'?", options: ["A tentativa de padronizar todas as culturas no modelo de consumidor", "A proteção dos territórios tradicionais", "A diversidade de línguas indígenas"], correct: 0 },
            { q: "Essa 'Humanidade' de consumo afasta as pessoas de suas origens com:", options: ["A Terra, a ancestralidade e o território", "Os computadores de última geração", "A poluição do ar"], correct: 0 },
            { q: "Para resistir à homogeneização cultural, Krenak valoriza:", options: ["A pluralidade de modos de vida dos povos da floresta e do campo", "O consumo igual em todas as redes de fast-food", "O esquecimento das tradições ancestrais"], correct: 0 },
            { q: "A 'Humanidade Uniforme' trata a natureza como mercadoria porque perdeu o sentido de:", options: ["Pertencimento e ancestralidade comunitária", "Lucro financeiro imediato", "Venda de produtos"], correct: 0 },
            { q: "A diversidade cultural dos povos originários é fundamental para garantir a:", options: ["Preservação dos ecossistemas e do planeta", "Destruição das matas", "Padronização das cidades"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 6: ADIAR O FIM DO MUNDO — 'Adiar o fim do mundo' é cantar, dançar, contar histórias e manter a poesia viva para não deixar o sistema devorar a nossa capacidade de sonhar.",
        questions: [
            { q: "O que significa 'Adiar o fim do mundo' no pensamento de Krenak?", options: ["Preservar a diversidade, a poesia, os cantos e os modos de vida em comunhão", "Construir bunkers subterrâneos para os ricos", "Acelerar a produção industrial"], correct: 0 },
            { q: "Para Krenak, o que sustenta o céu e impede o fim do mundo?", options: ["Nossa capacidade de sonhar, cantar e habitar a Terra com afeto", "O cimento das grandes construções urbanas", "As armas de guerra dos exércitos"], correct: 0 },
            { q: "Narrar histórias ancestrais e cultivar hortas comunitárias são formas de:", options: ["Resistência e adiamento da catástrofe ambiental", "Apatia e desperdício de tempo", "Aceitação do progresso destrutivo"], correct: 0 },
            { q: "O 'fim do mundo' que Krenak alerta é o resultado direto da:", options: ["Devoradora máquina de consumo antropocêntrica", "Abundância de florestas protegidas", "Falta de tecnologia financeira"], correct: 0 },
            { q: "Quando mantemos viva a relação de amor com a floresta, estamos:", options: ["Adiando o fim do mundo e criando futuros possíveis", "Destruindo a economia", "Vivendo no passado sem futuro"], correct: 0 }
        ]
    },
    {
        lesson: "📖 Lição 7: A PROPRIEDADE PRIVADA vs BEM COMUM — Serres e Krenak coincidem: a mania de transformar cada pedaço de terra e água em propriedade privada está matando o Bem Comum.",
        questions: [
            { q: "Qual o impacto de transformar a natureza em propriedade privada absoluta?", options: ["Destrói a noção de Bem Comum e privatiza o que deveria ser de todos", "Garante água limpa e gratuita para a população", "Protege as florestas da poluição"], correct: 0 },
            { q: "O ar, os oceanos e o clima pertencem à categoria do:", options: ["Bem Comum planetário que não pode ser apropriado por ninguém", "Mercado de ações privadas", "Comércio de produtos de luxo"], correct: 0 },
            { q: "A mercantilização da natureza transforma a vida em um bem de:", options: ["Troca financeira exclusivo de quem pode pagar", "Acesso livre e irrestrito", "Proteção coletiva universal"], correct: 0 },
            { q: "Defender o Bem Comum exige reconhecer os limites morais da:", options: ["Propriedade privada sobre os recursos essenciais da vida", "Preservação ambiental", "Educação comunitária"], correct: 0 },
            { q: "Para Krenak, a Terra não nos pertence; nós é que somos:", options: ["Filhos e pertencemos à Terra", "Donos e proprietários dela", "Inimigos de todos os seres"], correct: 0 }
        ]

// CONTROLES
window.addEventListener('keydown', e => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
        if (!keys.up && player.grounded && gameState === 'PLAYING') {
            player.vy = player.jumpPower;
            player.grounded = false;
        }
        keys.up = true;
    }
});

window.addEventListener('keyup', e => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
});

function bindTouchBtn(id, keyName) {
    const btn = document.getElementById(id);
    const press = (e) => {
        e.preventDefault();
        if (keyName === 'up') {
            if (player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
            }
        }
        keys[keyName] = true;
    };
    const release = (e) => {
        e.preventDefault();
        keys[keyName] = false;
    };
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
}

bindTouchBtn('btn-left', 'left');
bindTouchBtn('btn-right', 'right');
bindTouchBtn('btn-up', 'up');

function startGame() {
    const input = document.getElementById('student-name').value.trim();
    if (!input) {

        return;

    studentName = input;

    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    player.x = 40;
    player.y = 350;
    player.vx = 0;
    player.vy = 0;

    gameLoop();
}

function resizeCanvas() {
    if (!canvas) return;
    const wrapper = document.getElementById('canvas-wrapper');
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
}

function update() {
    if (gameState !== 'PLAYING') return;

    let isSlipperyZone = (selectedPhase === 2 && player.x >= 1100 && player.x <= 2000);

    if (isSlipperyZone) {
        if (keys.right) player.vx += 0.25;
        else if (keys.left) player.vx -= 0.25;
        else player.vx *= 0.96;

        player.vx = Math.max(-5.5, Math.min(5.5, player.vx));
    } else {
        if (keys.right) player.vx = player.speed;
        else if (keys.left) player.vx = -player.speed;
        else player.vx = 0;
    }

    player.vy += 0.52;

    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    player.grounded = false;

    platforms.forEach(p => {
        if (player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y) {

            if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 12) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
            else if (player.vy < 0 && player.y - player.vy >= p.y + p.height - 12) {
                player.y = p.y + p.height;
                player.vy = 0;

                if (p.type === 'block' && !p.hit) {
                    p.hit = true;
                    openLessonModal(p.id);
                } else if (p.type === 'empty' && !p.hit) {
                    p.hit = true;
                    showToast("Nenhuma dica aqui!");
                }
            }
            else if (p.type === 'pole' && hitCount < 12) {
                if (player.vx > 0) player.x = p.x - player.width;
            }
        }
    });

    enemies.forEach(en => {
        en.x += en.speed;
        if (en.x <= en.minX || en.x >= en.maxX) {
            en.speed *= -1;
        }

        if (player.x < en.x + en.width &&
            player.x + player.width > en.x &&
            player.y < en.y + en.height &&
            player.y + player.height > en.y) {
            
            showToast("Tente novamente!");
            player.x = Math.max(40, player.x - 150);
            player.y = 300;
            player.vx = 0;
        }
    });

    if (selectedPhase === 2) {
        rainDrops.forEach(drop => {
            drop.y += drop.speed;
            drop.x += 1.5;
            if (drop.y > canvas.height + 20) {
                drop.y = -20;
                drop.x = Math.random() * 6000;
            }
        });
    }

    cameraX = player.x - canvas.width * 0.35;
    if (cameraX < 0) cameraX = 0;

    cameraY = player.y - canvas.height * 0.65;
    if (cameraY > 100) cameraY = 100;

    // CONCLUSÃO DA FASE
    if (player.x >= 3410 && hitCount >= 12 && gameState !== 'WIN') {
        gameState = 'WIN';
        setTimeout(() => {
            if (selectedPhase === 1) {
                // AVANÇA PARA A FASE 2 AUTOMATICAMENTE
                showToast("Indo para a Fase 2: Retomada e Resistência!");
                setTimeout(() => {
                    selectedPhase = 2;
                    player.x = 40;
                    player.y = 350;
                    player.vx = 0;
                    player.vy = 0;
                    initWorld();
                    gameState = 'PLAYING';
                }, 1000);
            } else {
                // FINAL DA FASE 2: ABRE O SIMULADO DE 8 QUESTÕES
                openSarespSimulado();
            }
        }, 1200);
    }

    if (gameState === 'WIN') shakeTime += 0.2;
}

function draw() {
    if (!ctx) return;

    ctx.fillStyle = (selectedPhase === 2) ? '#1e293b' : '#38bdf8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    platforms.forEach(p => {
        if (p.type === 'ground') {
            let isIce = (selectedPhase === 2 && p.x >= 1000 && p.x <= 2000);
            ctx.fillStyle = isIce ? '#0284c7' : '#15803d';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = isIce ? '#e0f2fe' : '#22c55e';
            ctx.fillRect(p.x, p.y, p.width, 8);
        } else if (p.type === 'stone') {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#0f172a';
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'block' || p.type === 'empty') {
            ctx.fillStyle = p.hit ? '#78350f' : '#facc15';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.width, p.height);

            if (!p.hit) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('?', p.x + 11, p.y + 24);
            }
        } else if (p.type === 'pole') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'flag') {
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.width, p.y + p.height / 2);
            ctx.lineTo(p.x, p.y + p.height);
            ctx.fill();
        }
    });

    enemies.forEach(en => {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(en.x, en.y, en.width, en.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(en.x + 4, en.y + 4, 4, 4);
        ctx.fillRect(en.x + 14, en.y + 4, 4, 4);
    });

    if (selectedPhase === 2) {
        ctx.strokeStyle = 'rgba(186, 230, 253, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        rainDrops.forEach(drop => {
            if (drop.x >= cameraX - 50 && drop.x <= cameraX + canvas.width + 50) {
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x + 3, drop.y + drop.length);
            }
        });
        ctx.stroke();
    }

    ctx.fillStyle = '#16a34a';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#ca8a04';
    ctx.fillRect(player.x + 2, player.y + 16, player.width - 4, 12);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(player.x + 4, player.y + 6, 16, 10);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x + 6, player.y + 12, 12, 3);

    ctx.restore();

    if (gameState === 'WIN') {
        let shakeX = Math.sin(shakeTime * 10) * 8;
        let shakeY = Math.cos(shakeTime * 10) * 8;

        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2 + shakeX, canvas.height * 0.35 + shakeY);
        ctx.font = '900 48px Arial, sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.strokeText('Farmei!', 0, 0);
        ctx.fillText('Farmei!', 0, 0);
        ctx.restore();

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(20, canvas.height * 0.55, canvas.width - 40, 60);
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 3;
        ctx.strokeRect(20, canvas.height * 0.55, canvas.width - 40, 60);

        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.fillStyle = '#22c55e';
        ctx.textAlign = 'center';
        let txtMsg = (selectedPhase === 1) ? `Farmou a Fase 1, ${studentName}! Carregando Fase 2...` : `Farmou o Jogo Todo, ${studentName}! Abrindo Simulado Final...`;
        ctx.fillText(txtMsg, canvas.width / 2, canvas.height * 0.55 + 35);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function openLessonModal(idx) {
    gameState = 'PAUSED';
    currentLessonIdx = idx;
    currentStep = 0;

    const item = activeDatabase[idx];
    const qRandIdx = Math.floor(Math.random() * item.questions.length);
    currentQuestionObj = item.questions[qRandIdx];

    renderModalContent();
    document.getElementById('modal-overlay').style.display = 'flex';
}

function renderModalContent() {
    const box = document.getElementById('modal-content');
    box.innerHTML = '';

    if (currentStep === 0) {
        box.innerHTML = `
            <div class="modal-header">Fase ${selectedPhase} - Lição ${currentLessonIdx + 1} de 12</div>
            <div class="modal-body">${activeDatabase[currentLessonIdx].lesson}</div>
            <div class="prof-note">💬 Não entendeu? Pergunte ao professor.</div>
            <button class="btn-next" onclick="goToStep2()">Avançar ➔</button>
        `;
    } else {
        let opts = currentQuestionObj.options.map((opt, i) => ({
            text: opt,
            isCorrect: i === currentQuestionObj.correct
        }));

        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }

        let optsHTML = opts.map(o => `
            <button class="btn-opt" onclick="answerQuestion(${o.isCorrect})">${o.text}</button>
        `).join('');

        box.innerHTML = `
            <div class="modal-header">Verificação de Leitura 📝</div>
            <div style="font-size: 14px; font-weight: bold; color: #fff;">${currentQuestionObj.q}</div>
            <div class="options-list">${optsHTML}</div>
        `;
    }
}

function goToStep2() {
    currentStep = 1;
    renderModalContent();
}

function answerQuestion(isCorrect) {
    if (isCorrect) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (!unlockedTips[currentLessonIdx]) {
            unlockedTips[currentLessonIdx] = true;
            hitCount++;
            document.getElementById('hud-score').innerText = `Dicas: ${hitCount} / 12`;
        }
        gameState = 'PLAYING';
    } else {
        showErrorScreen();
    }
}

function showErrorScreen() {
    const box = document.getElementById('modal-content');
    box.innerHTML = `
        <div class="modal-header" style="color: #ef4444;">Atenção! ⚠️</div>
        <div class="modal-body" style="border-left-color: #ef4444; font-weight: bold; text-align: center;">
            Você errou! Volte 2 perguntas e leia as Lições com atenção!
        </div>
        <button class="btn-error-reset" onclick="confirmPenalizeTwoQuestions()">CONTINUAR ➔</button>
    `;
}

function confirmPenalizeTwoQuestions() {
    document.getElementById('modal-overlay').style.display = 'none';
    penalizeTwoQuestions();
}

function penalizeTwoQuestions() {
    let currentBlock = platforms.find(p => p.type === 'block' && p.id === currentLessonIdx);
    if (currentBlock) currentBlock.hit = false;

    let targetIdx = Math.max(0, currentLessonIdx - 2);

    for (let i = targetIdx; i <= currentLessonIdx; i++) {
        if (unlockedTips[i]) {
            unlockedTips[i] = false;
            hitCount = Math.max(0, hitCount - 1);
        }
        let blockToReset = platforms.find(p => p.type === 'block' && p.id === i);
        if (blockToReset) blockToReset.hit = false;
    }

    document.getElementById('hud-score').innerText = `Dicas: ${hitCount} / 12`;

    let targetBlock = platforms.find(p => p.type === 'block' && p.id === targetIdx);
    if (targetBlock) {
        player.x = Math.max(40, targetBlock.x - 80);
        player.y = 350;
    } else {
        player.x = 40;
        player.y = 350;
    }

    player.vx = 0;
    player.vy = 0;
    gameState = 'PLAYING';
}

// LÓGICA DO SIMULADO DE 8 QUESTÕES NO FINAL DA FASE 2
function openSarespSimulado() {
    document.getElementById('game-layout').style.display = 'none';
    document.getElementById('saresp-overlay').style.display = 'flex';

    const container = document.getElementById('saresp-questions');
    container.innerHTML = '';

    fullSarespQuestions.forEach((qObj, qIdx) => {
        let optsHTML = qObj.options.map((optText, oIdx) => `
            <div class="saresp-opt" id="opt-${qIdx}-${oIdx}" onclick="selectSarespOpt(${qIdx}, ${oIdx})">
                ${optText}
            </div>
        `).join('');

        let sectionHeader = (qIdx === 0 || qIdx === 4) ? `<div class="saresp-section-title">${qObj.section}</div>` : '';

        container.innerHTML += `
            ${sectionHeader}
            <div class="saresp-q-box">
                <div class="saresp-q-text">${qObj.q}</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">${optsHTML}</div>
            </div>
        `;
    });
}

function selectSarespOpt(qIdx, oIdx) {
    userAnswers[qIdx] = oIdx;
    fullSarespQuestions[qIdx].options.forEach((_, idx) => {
        const el = document.getElementById(`opt-${qIdx}-${idx}`);
        if (el) el.classList.remove('selected');
    });
    const selectedEl = document.getElementById(`opt-${qIdx}-${oIdx}`);
    if (selectedEl) selectedEl.classList.add('selected');
}

function submitSaresp() {
    if (userAnswers.includes(-1)) {
        alert("Por favor, responda a todas as 8 questões antes de finalizar!");
        return;
    }

    const container = document.getElementById('saresp-content');
    let gabaritoHTML = '';

    fullSarespQuestions.forEach((qObj, qIdx) => {
        const selectedIdx = userAnswers[qIdx];
        const correctIdx = qObj.correct;
        const isCorrect = selectedIdx === correctIdx;

        if (isCorrect) {
            gabaritoHTML += `
                <div class="gabarito-item correct">
                    <strong>Questão ${qIdx + 1} (${qIdx < 4 ? 'Serres/Krenak' : 'Nego Bispo'}): ✔️ CORRETA!</strong><br>
                    Sua resposta: ${qObj.options[selectedIdx]}
                </div>
            `;
        } else {
            gabaritoHTML += `
                <div class="gabarito-item wrong">
                    <strong>Questão ${qIdx + 1} (${qIdx < 4 ? 'Serres/Krenak' : 'Nego Bispo'}): ❌ INCORRETA!</strong><br><br>
                    <strong>Enunciado:</strong> ${qObj.q}<br><br>
                    <span style="color: #ef4444;"><strong>Sua resposta:</strong> ${qObj.options[selectedIdx]}</span><br>
                    <span style="color: #22c55e;"><strong>Resposta Correta:</strong> ${qObj.options[correctIdx]}</span>
                </div>
            `;
        }
    });

    container.innerHTML = `
        <div class="saresp-banner">Gabarito Final do Estudante: ${studentName} 📝</div>
        <div class="gabarito-box">${gabaritoHTML}</div>
        <div class="final-msg">Procure o professor para receber a nota do Simulado!</div>
    `;
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => {
        t.style.display = 'none';
    }, 1800);
}
</script>
